# Serves the static frontend and reverse-proxies /api to the backend
# container. Used by deployment/docker-compose.yml.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend — try the file, then fall back to index.html for
    # any unmatched path (not strictly needed for this multi-page site,
    # but harmless and future-proofs it).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container. The frontend's
    # js/constants.js should point API_BASE_URL at this same origin
    # (e.g. "" for same-origin, or "https://your-domain.com") so these
    # requests land here.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8080/health;
    }
}
