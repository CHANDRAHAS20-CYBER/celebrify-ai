# Runs the whole app locally with one command:
#   docker compose -f deployment/docker-compose.yml up --build
# Frontend: http://localhost:8000  |  Backend health check: http://localhost:8000/health
#
# Put your real Razorpay keys in backend/.env (copied from .env.example)
# before running this — docker-compose reads them from there.

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file:
      - ../backend/.env
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped
